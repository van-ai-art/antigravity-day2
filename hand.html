<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 손 인식 (MediaPipe GestureRecognizer)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      font-size: 1.75rem;
      margin-bottom: 12px;
      color: #38bdf8;
    }

    #status {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 16px;
      min-height: 1.4em;
    }

    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    #startBtn,
    #stopBtn {
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    #startBtn {
      background-color: #0284c7;
    }

    #startBtn:hover:not(:disabled) {
      background-color: #0369a1;
    }

    #stopBtn {
      background-color: #e11d48;
    }

    #stopBtn:hover:not(:disabled) {
      background-color: #be123c;
    }

    #startBtn:active:not(:disabled),
    #stopBtn:active:not(:disabled) {
      transform: scale(0.98);
    }

    #startBtn:disabled,
    #stopBtn:disabled {
      background-color: #475569;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .main-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 32px;
      width: 100%;
      max-width: 1000px;
      flex-wrap: wrap;
    }

    .viewer-container {
      position: relative;
      width: 640px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      background-color: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 2px solid #334155;
    }

    .count-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 280px;
      min-height: 360px;
      background-color: #1e293b;
      border-radius: 16px;
      border: 2px solid #334155;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      padding: 24px;
    }

    .count-label {
      font-size: 1.25rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    #fingerCount {
      font-size: 10rem;
      font-weight: 800;
      line-height: 1;
      color: #38bdf8;
      text-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
      user-select: none;
    }

    #gestureName {
      margin-top: 20px;
      padding-top: 16px;
      width: 100%;
      border-top: 1px solid #334155;
      text-align: center;
      font-size: 3rem;
      font-weight: 800;
      color: #4ade80;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    /* 거울처럼 좌우 반전 */
    #webcam,
    #output_canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #output_canvas {
      pointer-events: none;
    }
  </style>
</head>
<body>

  <h1>손 랜드마크 인식 (21개 마디)</h1>
  <p id="status">모델을 불러오는 중입니다...</p>
  <div class="button-group">
    <button id="startBtn" disabled>카메라 켜기</button>
    <button id="stopBtn" disabled>카메라 끄기</button>
  </div>

  <div class="main-layout">
    <div class="viewer-container">
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="count-panel">
      <span class="count-label">펴진 손가락 개수</span>
      <div id="fingerCount">-</div>
      <div id="gestureName">-</div>
    </div>
  </div>

  <script type="module">
    import {
      GestureRecognizer,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs";

    const statusText = document.getElementById("status");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const video = document.getElementById("webcam");
    const canvasElement = document.getElementById("output_canvas");
    const canvasCtx = canvasElement.getContext("2d");
    const fingerCountEl = document.getElementById("fingerCount");
    const gestureNameEl = document.getElementById("gestureName");

    let gestureRecognizer = null;
    let webcamRunning = false;
    let lastVideoTime = -1;
    let animationFrameId = null;

    // GestureRecognizer 결과 영문 이름 -> 한국어 손 모양 이름 매핑
    const GESTURE_NAMES = {
      Closed_Fist: " 주먹",
      Open_Palm: " 보",
      Pointing_Up: " 하나",
      Victory: " 브이",
      Thumb_Up: " 최고",
      Thumb_Down: " 별로",
      ILoveYou: " 사랑해"
    };

    // 깜빡임 방지를 위한 0.3초(300ms) 유지 상태 변수
    const HOLD_DURATION_MS = 300;
    let candidateCount = null;
    let candidateStartTime = 0;
    let displayedCount = null;

    // 두 점 사이의 거리 계산
    function getDistance(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    // 펴진 손가락 개수(0~5) 계산
    function countExtendedFingers(landmarks) {
      let count = 0;

      // 1) 엄지: 손끝(4번)이 새끼손가락 뿌리(17번)에서 엄지 둘째 마디(3번)보다 멀면 펴진 것으로 판단
      const thumbTipDist = getDistance(landmarks[4], landmarks[17]);
      const thumbIpDist = getDistance(landmarks[3], landmarks[17]);
      if (thumbTipDist > thumbIpDist) {
        count++;
      }

      // 2) 나머지 네 손가락: 손끝(8, 12, 16, 20번)이 손목(0번)에서 둘째 마디(6, 10, 14, 18번)보다 멀면 펴진 것으로 판단
      const fingers = [
        { tip: 8, pip: 6 },   // 검지
        { tip: 12, pip: 10 }, // 중지
        { tip: 16, pip: 14 }, // 약지
        { tip: 20, pip: 18 }  // 소지
      ];

      for (const finger of fingers) {
        const tipDist = getDistance(landmarks[finger.tip], landmarks[0]);
        const pipDist = getDistance(landmarks[finger.pip], landmarks[0]);
        if (tipDist > pipDist) {
          count++;
        }
      }

      return count;
    }

    // 같은 개수가 0.3초 이상 유지될 때만 화면 숫자 업데이트
    function updateFingerCountDisplay(newCount, nowInMs) {
      if (newCount !== candidateCount) {
        candidateCount = newCount;
        candidateStartTime = nowInMs;
      } else if (nowInMs - candidateStartTime >= HOLD_DURATION_MS) {
        if (displayedCount !== candidateCount) {
          displayedCount = candidateCount;
          fingerCountEl.textContent = displayedCount === null ? "-" : String(displayedCount);
        }
      }
    }

    // 21개 손가락 마디 기본 연결 구조 (HAND_CONNECTIONS 폴백용)
    const FALLBACK_CONNECTIONS = [
      { start: 0, end: 1 }, { start: 1, end: 2 }, { start: 2, end: 3 }, { start: 3, end: 4 },       // 엄지
      { start: 0, end: 5 }, { start: 5, end: 6 }, { start: 6, end: 7 }, { start: 7, end: 8 },       // 검지
      { start: 5, end: 9 }, { start: 9, end: 10 }, { start: 10, end: 11 }, { start: 11, end: 12 },  // 중지
      { start: 9, end: 13 }, { start: 13, end: 14 }, { start: 14, end: 15 }, { start: 15, end: 16 },// 약지
      { start: 13, end: 17 }, { start: 0, end: 17 }, { start: 17, end: 18 }, { start: 18, end: 19 }, { start: 19, end: 20 } // 소지 및 손바닥
    ];

    // 1. MediaPipe GestureRecognizer 초기화
    async function initGestureRecognizer() {
      try {
        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm"
        );

        gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });

        statusText.textContent = "모델 준비 완료! '카메라 켜기' 버튼을 눌러 주세요.";
        startBtn.disabled = false;
      } catch (error) {
        console.error("모델 로드 오류:", error);
        statusText.textContent = "모델을 불러오는 중 오류가 발생했습니다: " + error.message;
      }
    }

    initGestureRecognizer();

    // 2. 카메라 켜기 버튼 이벤트
    startBtn.addEventListener("click", async () => {
      if (!gestureRecognizer) {
        alert("아직 모델을 불러오는 중입니다. 잠시만 기다려 주세요.");
        return;
      }

      if (webcamRunning) {
        return;
      }

      try {
        startBtn.disabled = true;
        statusText.textContent = "카메라 권한을 요청하는 중...";

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 640 },
            height: { ideal: 480 },
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          webcamRunning = true;
          lastVideoTime = -1;
          startBtn.textContent = "카메라 켜기";
          stopBtn.disabled = false;
          statusText.textContent = "카메라에 손을 비추면 21개의 마디 점, 손가락 개수, 손 모양 이름이 표시됩니다.";
          predictWebcam();
        }, { once: true });
      } catch (error) {
        console.error("카메라 접근 오류:", error);
        startBtn.disabled = false;
        statusText.textContent = "카메라를 켤 수 없습니다. 카메라 권한을 확인해 주세요.";
      }
    });

    // 3. 카메라 끄기 버튼 이벤트
    stopBtn.addEventListener("click", () => {
      if (!webcamRunning) {
        return;
      }

      webcamRunning = false;
      if (animationFrameId !== null) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }

      if (video.srcObject) {
        const tracks = video.srcObject.getTracks();
        tracks.forEach((track) => track.stop());
        video.srcObject = null;
      }

      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      candidateCount = null;
      displayedCount = null;
      fingerCountEl.textContent = "-";
      gestureNameEl.textContent = "-";

      stopBtn.disabled = true;
      startBtn.disabled = false;
      statusText.textContent = "카메라가 꺼졌습니다. 다시 시작하려면 '카메라 켜기' 버튼을 눌러 주세요.";
    });

    // 4. 실시간 비디오 프레임 추론 및 21개 마디/연결선 그리기
    const drawingUtils = new DrawingUtils(canvasCtx);

    function predictWebcam() {
      if (!webcamRunning) {
        return;
      }

      if (canvasElement.width !== video.videoWidth || canvasElement.height !== video.videoHeight) {
        canvasElement.width = video.videoWidth;
        canvasElement.height = video.videoHeight;
      }

      const nowInMs = performance.now();
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = gestureRecognizer.recognizeForVideo(video, nowInMs);

        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

        if (results.landmarks && results.landmarks.length > 0) {
          const connections = GestureRecognizer.HAND_CONNECTIONS || FALLBACK_CONNECTIONS;
          const landmarks = results.landmarks[0];

          // 마디 연결선 그리기
          drawingUtils.drawConnectors(landmarks, connections, {
            color: "#00FF88",
            lineWidth: 4
          });
          // 21개 마디 점 그리기
          drawingUtils.drawLandmarks(landmarks, {
            color: "#FF3366",
            fillColor: "#FFFFFF",
            lineWidth: 2,
            radius: 5
          });

          // 펴진 손가락 개수 계산 및 0.3초 유지 시 표시 갱신
          const fingerCount = countExtendedFingers(landmarks);
          updateFingerCountDisplay(fingerCount, nowInMs);

          // GestureRecognizer 손 모양 이름 표시
          if (results.gestures && results.gestures.length > 0 && results.gestures[0].length > 0) {
            const categoryName = results.gestures[0][0].categoryName;
            gestureNameEl.textContent = GESTURE_NAMES[categoryName] || "-";
          } else {
            gestureNameEl.textContent = "-";
          }
        } else {
          updateFingerCountDisplay(null, nowInMs);
          gestureNameEl.textContent = "-";
        }

        canvasCtx.restore();
      }

      if (webcamRunning) {
        animationFrameId = window.requestAnimationFrame(predictWebcam);
      }
    }
  </script>
</body>
</html>
